[package]
name = "fashioncraft"
version = "0.2.1"
edition = "2024"
description = "3D garment design and cloth simulation: pattern editor, sewing and draping on an avatar"
license = "MIT"
repository = "https://github.com/opopina/FashionCraft"
homepage = "https://github.com/opopina/FashionCraft"
authors = ["erythrofr and ClothCraft contributors", "Ricardo Rivadeneira"]
default-run = "fashioncraft-reference"

# The CPU FEM reference and the original native editor. The studio is `cloth-fit --view`.
[[bin]]
name = "fashioncraft-reference"
path = "src/main.rs"

# The app people install: the studio, opened straight away.
[[bin]]
name = "fashioncraft"
path = "src/bin/fashioncraft.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
    "dep:eframe",
    "dep:bytemuck",
    "dep:pollster",
    "dep:rfd",
    "dep:ureq",
    "dep:keyring",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[dependencies]
glam = { version = "0.34.1", features = ["serde"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Agent tokens (src/agent.rs); already in the dependency tree.
getrandom = "0.3"
spade = "=2.15.1"
i_overlay = "=9.0.1"
quick-xml = "=0.41.0"
svgtypes = "=0.16.1"
tempfile = "3"
rfd = { version = "0.17.2", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
bytemuck = { version = "1", optional = true }
pollster = { version = "1.0.1", optional = true }
# Fabric maps: exports convert them (green flip, glossiness, packing); the studio reads the
# formats texture tools export, and Radiance HDR environments for the photoreal render.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "bmp", "hdr"] }
miniz_oxide = "0.8.9"
# The Assistant panel's calls to Claude and OpenAI-compatible APIs (rustls, Mozilla's roots).
ureq = { version = "3", optional = true, features = ["json"] }

# The Assistant's API keys: the macOS keychain and the Windows credential manager. Linux keeps
# them in a private file (src/atelier/assistant_keys.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

# On macOS: the Assistant's keys in the keychain, and the studio's menus in macOS's own menu
# bar (src/atelier/native_menu.rs; the objc2 versions eframe already uses, so nothing new is
# downloaded or built twice).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSWindow",
] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1
# Line tables keep file:line in backtraces at a fraction of full debug info: the desktop test
# build no longer fills a CI runner's disk.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
