[package]
name = "fashioncraft"
version = "0.1.0"
edition = "2024"
description = "3D garment design and cloth simulation: pattern editor, sewing and draping on an avatar"
license = "MIT"
repository = "https://github.com/opopina/FashionCraft"
homepage = "https://github.com/opopina/FashionCraft"
authors = ["erythrofr and ClothCraft contributors", "Ricardo Rivadeneira"]
default-run = "fashioncraft-reference"

# The CPU FEM reference and the original native editor. The studio is `cloth-fit --view`.
[[bin]]
name = "fashioncraft-reference"
path = "src/main.rs"

# The app people install: the studio, opened straight away.
[[bin]]
name = "fashioncraft"
path = "src/bin/fashioncraft.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:bytemuck", "dep:pollster", "dep:image", "dep:rfd"]

[dependencies]
glam = { version = "0.34.1", features = ["serde"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
spade = "=2.15.1"
i_overlay = "=9.0.1"
quick-xml = "=0.41.0"
svgtypes = "=0.16.1"
tempfile = "3"
rfd = { version = "0.17.2", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
bytemuck = { version = "1", optional = true }
pollster = { version = "1.0.1", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
miniz_oxide = "0.8.9"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
